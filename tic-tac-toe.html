<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --line: #d1d5db;
      --x: #2563eb;
      --o: #dc2626;
      --win: #fef3c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      background: var(--panel);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: min(420px, calc(100vw - 32px));
    }

    h1 { margin: 0 0 1rem; }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .score {
      flex: 1;
      padding: 0.5rem;
      border: 2px solid transparent;
      border-radius: 10px;
      background: var(--bg);
      font-weight: 600;
      transition: border-color 0.2s;
    }

    .score.active { border-color: currentColor; }
    #score-x.active { color: var(--x); }
    #score-o.active { color: var(--o); }

    .mark.x { color: var(--x); }
    .mark.o { color: var(--o); }

    .status {
      min-height: 1.5em;
      font-size: 1.15rem;
      margin: 0 0 1rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      aspect-ratio: 1;
      margin-bottom: 1.25rem;
    }

    .cell {
      font-size: clamp(2.5rem, 12vw, 4rem);
      font-weight: 700;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      cursor: pointer;
      transition: background 0.15s;
    }

    .cell:hover:not(:disabled) { background: var(--bg); }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win { background: var(--win); border-color: #f59e0b; }

    .controls {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .controls button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid var(--text);
      background: var(--text);
      color: #fff;
      cursor: pointer;
    }

    .controls button.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>Tic Tac Toe</h1>

    <div class="scoreboard">
      <div class="score" id="score-x"><span class="mark x">X</span> <span id="wins-x">0</span></div>
      <div class="score" id="score-draw"><span class="mark">Draws</span> <span id="draws">0</span></div>
      <div class="score" id="score-o"><span class="mark o">O</span> <span id="wins-o">0</span></div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="board" class="board" role="grid" aria-label="Tic Tac Toe board"></div>

    <div class="controls">
      <button id="new-game" type="button">New game</button>
      <button id="reset-scores" type="button" class="secondary">Reset scores</button>
    </div>
  </main>

  <script>
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
      [0, 4, 8], [2, 4, 6],            // diagonals
    ];

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const winsXEl = document.getElementById('wins-x');
    const winsOEl = document.getElementById('wins-o');
    const drawsEl = document.getElementById('draws');
    const scoreXEl = document.getElementById('score-x');
    const scoreOEl = document.getElementById('score-o');

    let board;
    let currentPlayer;
    let gameOver;
    let startingPlayer = 'X';
    const scores = { X: 0, O: 0, draws: 0 };

    // Build the 9 cells once; game state drives their contents.
    const cells = Array.from({ length: 9 }, (_, i) => {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(cell);
      return cell;
    });

    function findWinner() {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { player: board[a], line };
        }
      }
      return null;
    }

    function handleMove(index) {
      if (gameOver || board[index]) return;

      board[index] = currentPlayer;
      const winner = findWinner();

      if (winner) {
        gameOver = true;
        scores[winner.player]++;
        winner.line.forEach(i => cells[i].classList.add('win'));
        setStatus(`Player ${winner.player} wins!`);
      } else if (board.every(Boolean)) {
        gameOver = true;
        scores.draws++;
        setStatus("It's a draw!");
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        setStatus(`Player ${currentPlayer}'s turn`);
      }

      render();
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function render() {
      cells.forEach((cell, i) => {
        const value = board[i];
        cell.textContent = value || '';
        cell.classList.toggle('x', value === 'X');
        cell.classList.toggle('o', value === 'O');
        cell.disabled = gameOver || Boolean(value);
        cell.setAttribute('aria-label', `Cell ${i + 1}: ${value || 'empty'}`);
      });

      winsXEl.textContent = scores.X;
      winsOEl.textContent = scores.O;
      drawsEl.textContent = scores.draws;
      scoreXEl.classList.toggle('active', !gameOver && currentPlayer === 'X');
      scoreOEl.classList.toggle('active', !gameOver && currentPlayer === 'O');
    }

    function newGame() {
      board = Array(9).fill(null);
      currentPlayer = startingPlayer;
      // Alternate who goes first each game so neither player keeps the advantage.
      startingPlayer = startingPlayer === 'X' ? 'O' : 'X';
      gameOver = false;
      cells.forEach(cell => cell.classList.remove('win'));
      setStatus(`Player ${currentPlayer}'s turn`);
      render();
    }

    document.getElementById('new-game').addEventListener('click', newGame);
    document.getElementById('reset-scores').addEventListener('click', () => {
      scores.X = scores.O = scores.draws = 0;
      render();
    });

    newGame();
  </script>
</body>
</html>
